services:
  traefik:
    image: traefik:latest
    container_name: synapse-traefik
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      # HTTP entrypoint with global redirect to HTTPS
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--entrypoints.web.http.redirections.entryPoint.permanent=true"
      # HTTPS entrypoint
      - "--entrypoints.websecure.address=:443"
      # Let's Encrypt via TLS challenge
      - "--certificatesresolvers.myresolver.acme.tlschallenge=true"
      - "--certificatesresolvers.myresolver.acme.email=gopal@gopalchoudhary.dev"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./letsencrypt:/letsencrypt
    networks:
      - synapse-internal

  nodejs-server:
    image: gopalchoudhary/synapse-lm:latest
    container_name: synapse-api
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - traefik
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - synapse-internal
    labels:
      - "traefik.enable=true"
      # HTTPS router only (HTTP is redirected globally above)
      - "traefik.http.routers.nodejs.rule=Host(`synapsebackend.gopalchoudhary.dev`)"
      - "traefik.http.routers.nodejs.entrypoints=websecure"
      - "traefik.http.routers.nodejs.tls.certresolver=myresolver"
      - "traefik.http.services.nodejs.loadbalancer.server.port=8000"

networks:
  synapse-internal:
    driver: bridge
    name: synapse-internal

# Server-side setup (one-time, on EC2):
#   1. Install Docker Engine + Compose plugin
#   2. Open ports 80/443 in the security group
#   3. Point DNS A record  synapsebackend.gopalchoudhary.dev -> EC2 public IP
#   4. `git clone` this repo, `cd` into it
#   5. `cp .env.example .env`  then  edit `.env` with real secrets
#        (this file is excluded from git; do NOT commit it)
#   6. `docker compose up -d`
#   7. Subsequent deploys: `docker compose pull && docker compose up -d`
#      (ran automatically by .github/workflows/deploy.yml on push to main)