services:
  traefik:
    image: traefik:latest
    container_name: synapse-traefik
    restart: unless-stopped
    environment:
      - DOCKER_API_VERSION=1.44
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=synapse-internal"
      # HTTP entrypoint with global redirect to HTTPS
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--entrypoints.web.http.redirections.entryPoint.permanent=true"
      # HTTPS entrypoint
      - "--entrypoints.websecure.address=:443"
      # Let's Encrypt via HTTP challenge (port 80 must be open in AWS SG)
      - "--certificatesresolvers.myresolver.acme.httpchallenge=true"
      - "--certificatesresolvers.myresolver.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.myresolver.acme.email=gopalchoudhary521@gmail.com"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
      - "--log.level=INFO"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./letsencrypt:/letsencrypt
    networks:
      - synapse-internal
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nodejs-server:
    image: gopalchoudhary/synapse-lm:latest
    container_name: synapse-api
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8000"
    depends_on:
      - traefik
    networks:
      - synapse-internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=synapse-internal"
      - "traefik.http.routers.nodejs.rule=Host(`synapsebackend.gopalchoudhary.dev`)"
      - "traefik.http.routers.nodejs.entrypoints=websecure"
      - "traefik.http.routers.nodejs.tls.certresolver=myresolver"
      - "traefik.http.services.nodejs.loadbalancer.server.port=8000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  synapse-internal:
    driver: bridge
    name: synapse-internal

# Server-side setup (one-time, on EC2):
#   1. Install Docker Engine + Compose plugin
#   2. Open ports 80/443 in the EC2 security group
#   3. Point DNS A record synapsebackend.gopalchoudhary.dev -> EC2 public IP
#   4. `git clone` this repo or let GitHub Actions scp compose & env template
#   5. `cp deploy/.env.production.example .env` then edit `.env` with real secrets
#   6. Ensure acme.json exists with 600 permissions:
#      mkdir -p letsencrypt && touch letsencrypt/acme.json && chmod 600 letsencrypt/acme.json
#   7. `docker compose up -d`
#   8. Subsequent deploys: `docker compose pull && docker compose up -d`
#      (run automatically by .github/workflows/deploy.yml on push to main)
#
# If Traefik serves "TRAEFIK DEFAULT CERT":
#   - Ensure letsencrypt/acme.json has chmod 600 permissions
#   - Both containers MUST be up and on the SAME network (synapse-internal)
#   - `docker logs synapse-traefik | grep -i nodejs` -> router should be registered
#   - `cat letsencrypt/acme.json` -> cert should be present inside